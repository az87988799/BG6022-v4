name: Offline validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      # Official release tags verified at their upstream repositories.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11.4'
          architecture: x64
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.23'
          enable-cache: true
      # Only dependency installation may use the network. The tests forbid
      # network access and science launches; backend tests use local fixtures.
      - name: Install the committed dependency lock
        run: uv sync --locked --group dev --python 3.11.4
      - name: Lint without network
        run: uv run --offline --locked ruff check .
      - name: Test without network or scientific execution
        run: uv run --offline --locked pytest -q
