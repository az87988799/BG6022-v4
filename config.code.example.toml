# Explicit generated-code profile. Install the licensed ORCA image before use.
# No credentials, molecular algorithm, Plan or task script belongs in this file.
data_root = 'data/code-tools'
model_profile = 'disabled' # Explicit real-model JSON profile, frozen per Run.
observation_delivery_policy = 'reported-observation-2'
task_code_policy = 'nonempty-python-1'

[resources]
max_cores = 4
total_memory_mb = 1024
maxcore_mb = 192
environment_concurrency = 1
job_timeout_seconds = 900
script_timeout_seconds = 1200
collection_timeout_seconds = 180

[model]
model_name = 'deepseek-flash'
input_tokens = 64000
output_tokens = 32768
timeout_seconds = 180
response_bytes = 524288
proposal_bytes = 131072

[execution]
backend = 'linux-container'
docker_path = 'C:\Program Files\Docker\Docker\resources\bin\docker.exe'
docker_context = 'desktop-linux'
# Fixed local image with isolated Python runtime files; never migrates old Runs.
image_id = 'sha256:364491981f50643cd767e58ce637d79a5eab154cb76fa49dae1c6f78f3dbfdb7'
manifest_sha256 = '72033340b8679b2b85f02eab972e6308dd9fe054db2f4d17163b14a789f093fd'
python_runtime_layout = 'isolated-1'

[execution.native_input_policy]
profile = 'managed-native-1'
allow_task_geometry = true # New Runs only; preserves initial geometry and ordered elements.
property_block_order = 'coordinates-first-1' # Preserve content and archive audited ordering changes.
max_atoms = 1024
max_geom_iterations = 128
max_scf_iterations = 256
max_response_iterations = 128

[text]
enabled = true

[text.defaults]
# Disclosed profile defaults, never inferred from electron parity.
charge = 0
multiplicity = 1
electronic_state = 'RKS'
environment = 'gas_phase'

[text.permission]
model_execution = true
scientific_execution = true
code_execution = true
artifact_writes = true
external_identity_queries = true
geometry_preparation = true
allowed_tools = ['structure.resolve', 'structure.prepare', 'workspace.write', 'python.execute', 'orca.run', 'evidence.list', 'evidence.discover', 'evidence.search', 'evidence.value', 'evidence.text', 'knowledge.search', 'knowledge.answer']
max_cores = 4
max_memory_mb = 1024
allow_additional_science = true

[text.budget]
logical_steps = 32
attempts_per_step = 12
orca_starts = 12
extra_orca_starts = 11
internal_work_units = 10000
code_retries = 11
run_seconds = 7200
model_calls = 48
plan_revisions = 32
model_tokens = 1200000
input_tokens = 64000
output_tokens = 32768
decision_rounds = 80
evidence_reads = 24
analysis_executions = 12
corrections_per_proposal = 47
transport_retries = 0
identity_queries = 2
structure_preparations = 1
knowledge_queries = 24
artifact_count = 800
artifact_bytes = 268435456
artifact_total_bytes = 268435456
