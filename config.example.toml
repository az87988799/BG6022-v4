# Copy to config.local.toml and edit absolute executable paths for your machine.
orca_path = 'E:\orca\orca.exe'
mpi_path = 'C:\Program Files\Microsoft MPI\Bin\mpiexec.exe'
data_root = 'data'

[execution]
backend = 'windows-lpac'
# This backend accepts explicit serial ORCA requests only. For the frozen local
# Linux image and four-rank MPI, see scripts/container_runtime/README.md.

# Resource and budget limits are validated and frozen per Run.
# This implementation enables one environment slot; larger values are expressible
# but launch is refused until shared multi-job resource management is implemented.
# Its location is independent of data_root.
# Agent credentials are read only from DEEPSEEK_API_KEY in the process environment.
# Do not put keys in this file. Model alias and HTTPS endpoint retain the validated
# profile; request bundles grant individual effects and cumulative budgets.

[resources]
max_cores = 4
total_memory_mb = 1024
maxcore_mb = 192
environment_concurrency = 1
job_timeout_seconds = 900
script_timeout_seconds = 300
collection_timeout_seconds = 30

[model]
input_tokens = 24000
output_tokens = 2000
timeout_seconds = 60
response_bytes = 131072
proposal_bytes = 32768
messages = 64

# New Runs freeze these settings. Editing this file does not change existing Runs.
# Task Python and one SDK ORCA call require the Run's explicit execution permission.
