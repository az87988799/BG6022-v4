orca_path = 'E:\orca\orca.exe'
mpi_path = 'C:\Program Files\Microsoft MPI\Bin\mpiexec.exe'
data_root = 'data'

# Resource and budget limits are validated and frozen per Run.
# Global environment concurrency is one; its location is independent of data_root.
