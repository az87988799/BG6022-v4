[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "orca-agent"
version = "0.1.0"
description = "Evidence-preserving local ORCA execution foundation"
requires-python = ">=3.11,<3.14"
dependencies = ["orca-pi==2.0.0", "pydantic>=2.11,<3", "filelock>=3.18,<4", "psutil>=7,<8", "openai==2.28.0", "httpx==0.28.1"]

[project.scripts]
orca-agent = "orca_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/orca_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "live: requires explicit --live-orca and an installed ORCA",
  "backend: offline managed test subprocesses (never scientific programs)",
  "model: requires --live-model and only permits DeepSeek HTTPS; no scientific processes",
  "e2e: requires both --live-model and --live-orca for joint acceptance evidence",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
